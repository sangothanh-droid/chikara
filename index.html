<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chikara</title>
<meta name="description" content="Carnet de musculation : séances, minuteur, progrès et personnage qui monte en niveau.">
<meta name="theme-color" content="#060606">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chikara">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
img{max-width:100%} [hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Boku&text=%E5%8A%9B%E9%AC%BC&display=swap">
<style>
/* Layout: single mobile column over a fixed backdrop (brush kanji or the user's own photo), sticky header, fixed 5-tab bar, red rest timer docked above it. Deliberately dark-only: red and black. */
:root{
  color-scheme:dark;
  --bg:#060606; --surface:rgba(14,14,14,.86); --surface-2:#1b1b1b; --surface-3:#262626;
  --fg:#f4f4f4; --muted:#a6a6a6; --line:#2e2e2e;
  --red:#e10600; --red-hi:#ff3b2f; --red-deep:#5c0000; --on-red:#ffffff; --gold:#f2c94c;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --brush:"Yuji Boku","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --nav-h:62px; --r:6px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* backdrop */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(120% 70% at 85% 10%,#2a0000 0%,var(--bg) 60%)}
#bg .kanji{position:absolute;right:-6vw;top:8vh;font-family:var(--brush);font-size:min(118vw,700px);line-height:.9;color:#fff;opacity:.13;transform:rotate(-6deg);user-select:none}
#bg .kanji.small{right:auto;left:-4vw;top:auto;bottom:6vh;font-size:min(46vw,280px);color:var(--red);opacity:.22;transform:rotate(8deg)}
#bg .slash{position:absolute;left:-20%;top:42%;width:140%;height:14px;background:var(--red);opacity:.55;transform:rotate(-18deg);box-shadow:0 0 40px var(--red)}
#bg .slash.b{top:47%;height:4px;opacity:.4}
#bg .photo{position:absolute;inset:0;background-size:cover;background-position:center top}
#bg .photo.blanc{filter:grayscale(1) contrast(1.7) brightness(1.25)}
#bg .photo.rouge{filter:grayscale(1) contrast(1.5) brightness(1.1) sepia(1) saturate(6) hue-rotate(-50deg)}
#bg .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,6,6,.35) 0%,rgba(6,6,6,.6) 55%,rgba(6,6,6,.92) 100%)}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(6,6,6,.92);border-bottom:2px solid var(--red);backdrop-filter:blur(8px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}

.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;flex:none;display:grid;place-items:center;background:#000;border:1.5px solid var(--red);border-radius:8px;font-family:var(--brush);font-size:30px;line-height:1;color:#fff;position:relative;overflow:hidden;box-shadow:0 0 12px rgba(225,6,0,.45)}
.logo::after{content:"";position:absolute;left:-6px;right:-6px;top:56%;height:4px;background:var(--red);transform:rotate(-18deg);opacity:.9}
h1{font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1}
h1 b{color:var(--red);font-weight:400}
h2{font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1;text-wrap:balance}
h3{font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1.1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--red);box-shadow:0 0 8px var(--red)} .sync.err i{background:var(--gold)}
main.wrap{z-index:1;padding-block:18px calc(var(--nav-h) + 110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;backdrop-filter:blur(6px)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nowrap{flex-wrap:nowrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px} .red{color:var(--red-hi)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
button{font:inherit;color:var(--fg);cursor:pointer;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:9px 13px;min-height:40px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
button.primary{background:var(--red);color:var(--on-red);border-color:var(--red);font-family:var(--display);font-size:18px;letter-spacing:.06em;text-transform:uppercase}
button.primary:active{background:var(--red-hi)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.danger{color:var(--red-hi)}
button.armed{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.block{width:100%}
input,textarea,select{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-height:40px;width:100%;min-width:0}
input[type=range]{padding:0;accent-color:var(--red);background:transparent;border:0}
input[type=file]{padding:6px}
textarea{resize:vertical;min-height:70px}
.empty{text-align:center;padding:28px 16px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty strong{color:var(--fg);font-family:var(--display);font-weight:400;font-size:26px;text-transform:uppercase;letter-spacing:.03em}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;border-radius:3px;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.chip.hot{background:var(--red);color:var(--on-red);font-weight:700}
.chip.gold{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);font-weight:700}
.day-ex{font-size:13px;color:var(--muted)}

/* workout */
.wk-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.elapsed{font-family:var(--display);font-size:46px;line-height:1;font-variant-numeric:tabular-nums;color:var(--fg)}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 48px;gap:6px;align-items:center}
.sets .h{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.sets .n{font-family:var(--display);font-size:20px;color:var(--muted);text-align:center}
.sets input{text-align:center;font-family:var(--display);font-size:22px;padding:6px;letter-spacing:.02em}
.done-btn{padding:0;min-height:42px;font-size:18px;font-weight:800}
.done-btn.on{background:var(--red);border-color:var(--red);color:var(--on-red)}
.set-done{background:color-mix(in srgb,var(--red) 16%,var(--surface-2))!important;border-color:var(--red-deep)!important}
.warm{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.warm div{display:flex;justify-content:space-between;gap:8px;align-items:center}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{min-height:36px;padding:5px 12px;font-family:var(--display);font-size:18px}

/* plates */
.plates{display:flex;align-items:center;gap:2px;min-height:44px;overflow-x:auto}
.plates .bar{width:44px;height:8px;background:#bdbdbd;border-radius:2px;flex:none}
.plates .sleeve{width:10px;height:14px;background:#8a8a8a;flex:none}
.plate{flex:none;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#111;writing-mode:vertical-rl}
.plates-txt{font-size:13px;color:var(--muted)}

/* program editor */
.ex-edit{display:grid;grid-template-columns:1fr 1fr 1fr 40px;gap:6px;align-items:end;padding-top:10px;border-top:1px dashed var(--line)}
.ex-edit .name{grid-column:1 / -1}
.ex-edit label,.field{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

/* progress */
.seg{display:flex;background:var(--surface-2);border-radius:var(--r);padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;min-height:34px;padding:4px 6px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--red);color:var(--on-red);font-weight:700}
.chart{width:100%;height:auto;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:var(--r);padding:10px;min-width:0}
.stat .v{font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(13,1fr);gap:3px}
.cal i{aspect-ratio:1;border-radius:2px;background:var(--surface-3);max-width:100%}
.cal i.l1{background:#5c0000}.cal i.l2{background:#9a0500}.cal i.l3{background:var(--red)}.cal i.l4{background:var(--red-hi);box-shadow:0 0 6px var(--red)}
.cal i.today{outline:1px solid var(--fg)}
.cal i.void{background:transparent}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td.n{font-family:var(--display);font-size:16px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
details.hist{border-top:1px solid var(--line);padding-top:8px}
details.hist summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
details.hist summary::-webkit-details-marker{display:none}
.hist-body{font-size:13px;color:var(--muted);padding:8px 0;display:flex;flex-direction:column;gap:4px}
.hist-body b{color:var(--fg);font-weight:600}
.note-text{white-space:pre-wrap;overflow-wrap:anywhere}
.big-out{font-family:var(--display);font-size:44px;line-height:1;color:var(--red-hi)}

/* hero / levels */
.hero{display:flex;gap:12px;align-items:center;cursor:pointer}
.hero .av{flex:none;width:84px}
.hero .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.xpbar{height:10px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red-hi));box-shadow:0 0 10px var(--red)}
.lvl{font-family:var(--display);font-size:22px;line-height:1;white-space:nowrap}
.avatar{width:100%;height:auto;display:block}
.hero-img{width:100%;aspect-ratio:1;border-radius:50%;background-size:cover;background-position:center top;border:2px solid var(--fg)}
.goal{display:inline-flex;gap:3px;align-items:center}
.goal i{width:14px;height:6px;background:var(--surface-3);border-radius:1px}
.goal i.on{background:var(--red)}
.paths{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.paths button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;min-width:0}
.paths button i{width:18px;height:18px;border-radius:50%}
.paths button.on{border-color:var(--fg);background:var(--surface-3)}
.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.form{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:8px;text-align:center;min-width:0;display:flex;flex-direction:column;gap:2px;align-items:center}
.form.locked .av,.form.locked b{opacity:.4}
.pick{font:inherit;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:4px 8px;min-height:28px;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-3);cursor:pointer;color:var(--fg)}
.form.cur{border-color:var(--red)}
.form .av{width:64px}
.form b{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.03em;text-transform:uppercase;overflow-wrap:anywhere}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.badge{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-width:0;opacity:.45}
.badge.got{opacity:1;border-color:var(--red)}
.badge b{display:block;font-size:13px}
.badge span{font-size:11px;color:var(--muted)}
.lvlup{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;cursor:pointer}
.lvlup .av{width:min(60vw,260px)}
.lvlup .big{font-family:var(--display);font-size:68px;line-height:1;color:var(--red-hi);text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){
  .aura{animation:aura 2.2s ease-in-out infinite;transform-origin:50% 60%;transform-box:fill-box}
  @keyframes aura{50%{transform:scale(1.06);opacity:.7}}
  .spark{animation:spark 1.1s steps(2) infinite}
  @keyframes spark{50%{opacity:.2}}
  .flick{animation:flick 1.5s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
  @keyframes flick{50%{transform:scale(.93,1.13)}}
  .breathe{animation:breathe 3.4s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
  @keyframes breathe{50%{transform:scale(1.008,1.02)}}
  .sway{animation:sway 2.6s ease-in-out infinite;transform-origin:20% 10%;transform-box:fill-box}
  @keyframes sway{50%{transform:skewX(-6deg) scaleX(1.05)}}
  .rise{animation:rise 2.4s ease-in-out infinite}
  @keyframes rise{50%{transform:translateY(-9px)}}
  .lvlup::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,#fff 0,transparent 62%);opacity:0;animation:flash .9s ease-out;pointer-events:none}
  @keyframes flash{0%{opacity:.95}100%{opacity:0}}
  .lvlup .big{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.3);opacity:0}}
}

/* quests, boss, muscles, summary */
.rank{font-family:var(--display);font-size:15px;line-height:1;padding:3px 6px;border:1.5px solid var(--red-hi);color:var(--red-hi);border-radius:3px;letter-spacing:.04em}
.quest{display:flex;flex-direction:column;gap:4px;padding-top:8px;border-top:1px solid var(--line)}
.quest b{font-size:14px}
.xpbar.thin{height:5px}
.quest.ok .xpbar i{background:var(--gold);box-shadow:none}
.boss{background:linear-gradient(135deg,rgba(60,0,0,.9),var(--surface) 70%)}
.boss.dead{opacity:.85}
.boss-name{font-family:var(--display);font-size:32px;line-height:1;text-transform:uppercase;letter-spacing:.03em}
.boss.dead .boss-name{text-decoration:line-through;text-decoration-color:var(--red)}
.hpbar{height:16px;background:#1a0000;border:1px solid var(--red-deep);border-radius:2px;overflow:hidden}
.hpbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--red) 0 12px,var(--red-hi) 12px 14px)}
.mus{display:grid;grid-template-columns:auto 1fr 28px;gap:6px 8px;align-items:center;font-size:13px}
.mbar{position:relative;height:10px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.mbar .zone{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.12)}
.mbar i{position:absolute;left:0;top:0;bottom:0;background:var(--muted)}
.mbar i.in{background:var(--red)}
.mus b{text-align:right;font-weight:400}
.energy{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.energy button{font-family:var(--display);font-size:22px}
.energy button.on{background:var(--red);border-color:var(--red);color:var(--on-red)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.95);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .wrap{padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.big-lvl{font-family:var(--display);font-size:56px;line-height:1;color:var(--red-hi);text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){.big-lvl{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}}

/* timer */
.timer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:25;padding-bottom:8px}
.timer .box{background:var(--red);color:var(--on-red);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(225,6,0,.45);position:relative;overflow:hidden}
.timer .t{font-family:var(--display);font-size:42px;line-height:1;font-variant-numeric:tabular-nums;min-width:90px}
.timer .lbl{font-size:12px;opacity:.85;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button{background:transparent;color:inherit;border-color:rgba(255,255,255,.45);min-height:38px;padding:4px 10px;font-family:var(--display);font-size:17px}
.timer .bar{position:absolute;left:0;bottom:0;height:4px;background:#fff}
.timer.ending .box{background:#fff;color:#000}
.timer.ending button{border-color:rgba(0,0,0,.35)}
.timer.ending .bar{background:var(--red)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:26;background:#000;border-top:2px solid var(--red);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav button{border:0;background:transparent;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0;min-width:0}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--red-hi)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 92px + env(safe-area-inset-bottom,0px));background:#fff;color:#000;padding:10px 16px;border-radius:var(--r);font-size:14px;font-weight:600;z-index:40;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:no-preference){.timer .bar{transition:width .25s linear}}
</style>
</head>
<body>


<div id="bg" aria-hidden="true"></div>

<header><div class="wrap">
  <div class="brand"><span class="logo" aria-hidden="true">力</span><h1>Chi<b>kara</b></h1></div>
  <span class="sync" id="sync"><i></i><span>Chargement…</span></span>
</div></header>

<main class="wrap" id="main"></main>

<div class="timer" id="timer" hidden><div class="wrap"><div class="box">
  <span class="t" id="tTime">1:30</span>
  <span class="lbl" id="tLbl">Repos</span>
  <button data-act="tadd" data-v="-15">−15</button>
  <button data-act="tadd" data-v="15">+15</button>
  <button data-act="tstop">Passer</button>
  <span class="bar" id="tBar"></span>
</div></div></div>

<nav><div class="wrap">
  <button data-tab="seance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Séance</button>

<div class="lvlup" id="lvlup" hidden data-act="closelvl"></div>
<div class="sheet" id="summary" hidden role="dialog" aria-label="Résumé de séance"></div>

<script>
(() => {
const main = document.getElementById('main');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmtKg = n => (Math.round(n * 100) / 100).toLocaleString('fr-FR');
const fmtDate = t => new Date(t).toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'short'});
const fmtDur = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}` : `${m}:${String(x).padStart(2,'0')}`; };
const e1rm = (w, r) => r > 0 && w > 0 ? (r === 1 ? w : w * (1 + r / 30)) : 0;
const topReps = s => { const m = String(s||'').match(/\d+/g); return m ? Math.max(...m.map(Number)) : 0; };
const daysAgo = t => { const d = Math.floor((startOfDay(Date.now()) - startOfDay(t)) / 864e5); return d <= 0 ? "aujourd'hui" : d === 1 ? 'hier' : `il y a ${d} j`; };
const startOfDay = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const round = (w, step) => Math.round(w / step) * step;

/* ---------- state ---------- */
const DEF_SETTINGS = () => ({bar:20, plates:[25,20,15,10,5,2.5,1.25], sound:true, goal:3, hero:{path:'braise', name:'', imgs:{}}, bg:{mode:'kanji', id:null, local:false, fx:'blanc', op:.45}});
const EMPTY = () => ({program:{days:[]}, sessions:[], notes:[], body:{entries:[]}, measures:{entries:[]}, settings:DEF_SETTINGS(), current:null});
let S = EMPTY();
let tab = 'seance';
let prog = {ex:null, metric:'e1rm'};
let tools = {plate:100, rmW:100, rmR:5, warm:100};
const openWarm = new Set();
const LS = 'carnet-muscu-v1';
try { const c = JSON.parse(localStorage.getItem(LS) || 'null'); if (c) { S = Object.assign(EMPTY(), c); S.settings = Object.assign(DEF_SETTINGS(), c.settings || {}); } } catch {}
try { tab = localStorage.getItem(LS + '-tab') || 'seance'; } catch {}
const saveCache = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch {} };

/* ---------- store (db capability, local fallback) ---------- */
let col = null, connected = false, assetsApi = null, downloadsApi = null;
const touched = {}; const chains = {}; const debT = {};
function setSync(state, text){ const el = document.getElementById('sync'); el.className = 'sync ' + state; el.lastElementChild.textContent = text; }
function put(id, data){
  saveCache(); if (!col) return;
  touched[id] = Date.now();
  chains[id] = (chains[id] || Promise.resolve()).then(() => col.doc(id).set(data)).then(() => { touched[id] = Date.now(); })
    .catch(e => { console.warn(e); setSync('err', e?.code === 'quota_exceeded' ? 'Stockage plein' : 'Erreur de synchro'); });
}
function del(id){
  saveCache(); if (!col) return;
  touched[id] = Date.now();
  chains[id] = (chains[id] || Promise.resolve()).then(() => col.doc(id).delete()).catch(e => console.warn(e));
}
function later(id, make, ms = 700){ touched[id] = Date.now(); clearTimeout(debT[id]); debT[id] = setTimeout(() => { delete debT[id]; put(id, make()); }, ms); }
const saveProgram = () => later('program', () => ({type:'program', days:S.program.days}));
const saveCurrent = (ms) => later('current', () => ({type:'current', session:S.current}), ms ?? 900);
const saveBody = () => put('body', {type:'body', entries:S.body.entries});
const saveMeasures = () => put('measures', {type:'measures', entries:S.measures.entries});
const saveSettings = (ms) => later('settings', () => ({type:'settings', ...S.settings}), ms ?? 500);
const fresh = id => debT[id] || (Date.now() - (touched[id] || 0) < 4000);

function applySnap(snap){
  const n = EMPTY();
  for (const d of snap.docs){ const v = d.data(); if (!v) continue;
    if (v.type === 'program') n.program = {days: v.days || []};
    else if (v.type === 'current') n.current = v.session || null;
    else if (v.type === 'session') n.sessions.push(v);
    else if (v.type === 'note') n.notes.push(v);
    else if (v.type === 'body') n.body = {entries: v.entries || []};
    else if (v.type === 'measures') n.measures = {entries: v.entries || []};
    else if (v.type === 'settings') { const {type, ...rest} = v; n.settings = Object.assign(DEF_SETTINGS(), rest); }
  }
  for (const k of ['program','current','body','measures','settings']) if (fresh(k)) n[k] = S[k];
  if (Object.keys(touched).some(k => (k.startsWith('s-') || k.startsWith('n-')) && fresh(k))) { n.sessions = S.sessions; n.notes = S.notes; }
  // a local-only background stays on this device
  if (S.settings.bg?.local && !n.settings.bg?.id) n.settings.bg = S.settings.bg;
  const bgChanged = JSON.stringify(n.settings.bg) !== JSON.stringify(S.settings.bg);
  S = n; saveCache(); if (bgChanged) paintBg(); softRender();
}
function pushAll(){
  put('program', {type:'program', days:S.program.days});
  S.sessions.forEach(s => put(s.id, {type:'session', ...s}));
  S.notes.forEach(x => put(x.id, {type:'note', ...x}));
  saveBody(); saveMeasures(); put('settings', {type:'settings', ...S.settings});
  if (S.current) put('current', {type:'current', session:S.current});
}

async function connect(){
  if (!window.claude?.use){ setSync('on', 'Sur cet appareil'); return; }
  claude.use('assets').then(a => { assetsApi = a; if (tab === 'outils') softRender(); }).catch(() => {});
  claude.use('downloads').then(d => { downloadsApi = d; }).catch(() => {});
  const slow = setTimeout(() => { if (!connected) setSync('', 'Hors ligne · local'); }, 10000);
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid){ clearTimeout(slow); setSync('on', 'Sur cet appareil'); return; }
    col = db.collection('data/users/' + uid);
    let first = true;
    col.onSnapshot(snap => {
      if (first && !snap.metadata.fromCache){
        first = false;
        if (snap.empty && (S.program.days.length || S.sessions.length || S.notes.length)) {
          pushAll(); connected = true; clearTimeout(slow); setSync('on', 'Synchronisé'); return;
        }
      }
      if (!snap.metadata.fromCache){ connected = true; clearTimeout(slow); setSync('on', 'Synchronisé'); }
      applySnap(snap);
    }, err => { clearTimeout(slow); setSync('err', err.code === 'revoked' ? 'Accès retiré' : 'Synchro interrompue'); });
  } catch (e) { clearTimeout(slow); console.warn(e); setSync('on', 'Sur cet appareil'); }
}

/* ---------- backdrop ---------- */
function bgUrl(){
  const b = S.settings.bg;
  if (b.mode !== 'image') return null;
  if (b.local){ try { return localStorage.getItem(LS + '-bg'); } catch { return null; } }
  return b.id ? '/_blob/' + b.id : null;
}
function paintBg(){
  const el = document.getElementById('bg'); const b = S.settings.bg; const u = bgUrl();
  if (u){
    el.innerHTML = `<div class="photo ${b.fx === 'couleur' ? '' : b.fx}" style="opacity:${b.op}"></div><div class="slash b" style="opacity:.25"></div><div class="shade"></div>`;
    el.firstChild.style.backgroundImage = `url("${u.replace(/"/g, '%22')}")`;
  } else {
    el.innerHTML = `<div class="kanji">力</div><div class="slash"></div><div class="slash b"></div><div class="kanji small">鬼</div><div class="shade" style="opacity:.55"></div>`;
  }
}
async function resizeImage(file, max = 1600){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(ok => c.toBlob(ok, 'image/jpeg', .85));
  } finally { URL.revokeObjectURL(url); }
}
async function setBgImage(file){
  if (!file || !/^image\//.test(file.type)) { toast('Choisis un fichier image (JPG, PNG, WebP)'); return; }
  toast('Préparation de l’image…');
  try {
    const blob = await resizeImage(file);
    const old = S.settings.bg;
    if (assetsApi){
      const r = await assetsApi.upload(blob);
      S.settings.bg = {...old, mode:'image', id:r.id, local:false};
      if (old.id && old.id !== r.id) assetsApi.delete(old.id).catch(() => {});
      try { localStorage.removeItem(LS + '-bg'); } catch {}
    } else {
      const small = await new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(blob); });
      try { localStorage.setItem(LS + '-bg', small); } catch { toast('Image trop lourde pour cet appareil'); return; }
      S.settings.bg = {...old, mode:'image', id:null, local:true};
    }
    saveSettings(0); paintBg(); render(); toast('Fond mis à jour');
  } catch (e) { console.warn(e); toast('Envoi de l’image impossible, réessaie avec une image plus légère'); }
}

/* ---------- data helpers ---------- */
const sessionsSorted = () => [...S.sessions].sort((a,b) => b.date - a.date);
const same = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
function lastFor(name){
  for (const s of sessionsSorted()){ const ex = s.exercises.find(e => same(e.name, name)); if (ex) return {date:s.date, ex}; }
  return null;
}
function allExerciseNames(){
  const c = {};
  S.sessions.forEach(s => s.exercises.forEach(e => { const k = e.name.trim(); c[k] = (c[k]||0) + 1; }));
  S.program.days.forEach(d => d.exercises.forEach(e => { const k = e.name.trim(); if (k && !c[k]) c[k] = 0; }));
  return Object.keys(c).sort((a,b) => c[b] - c[a] || a.localeCompare(b));
}
const volOf = s => s.exercises.reduce((t,e) => t + e.sets.reduce((u,x) => u + num(x.w) * num(x.r), 0), 0);
function platesFor(total){
  const {bar, plates} = S.settings;
  let side = (total - bar) / 2; const out = [];
  if (side < 0) return {out, rest: side, ok:false};
  for (const p of [...plates].sort((a,b) => b - a)){ while (side >= p - 1e-9){ out.push(p); side -= p; } }
  return {out, rest: Math.round(side * 100) / 100, ok:true};
}
const PLATE_COL = {25:'#e10600', 20:'#2f6bff', 15:'#f2c94c', 10:'#2ea44f', 5:'#f4f4f4', 2.5:'#7a7a7a', 1.25:'#bdbdbd', 0.5:'#d0d0d0'};
function platesHTML(total, compact){
  const r = platesFor(total);
  if (!r.ok) return `<div class="plates-txt">Moins que la barre (${fmtKg(S.settings.bar)} kg).</div>`;
  const h = p => Math.round(18 + Math.min(p, 25) / 25 * 30);
  const vis = `<div class="plates"><span class="bar"></span>${r.out.map(p => `<span class="plate" style="height:${h(p)}px;width:${p >= 10 ? 13 : 9}px;background:${PLATE_COL[p] || '#9a9a9a'}">${p >= 10 ? p : ''}</span>`).join('')}<span class="sleeve"></span></div>`;
  const txt = `<div class="plates-txt">Par côté : <b class="num" style="color:var(--fg)">${r.out.length ? r.out.map(fmtKg).join(' + ') : 'rien'}</b>${r.rest > 0 ? ` · reste ${fmtKg(r.rest)} kg non chargeable` : ''}</div>`;
  return compact ? txt : vis + txt;
}
function warmupFor(work){
  const {bar} = S.settings; const step = 2.5;
  const rows = [{w: bar, r: 10}];
  [[.4,5],[.6,3],[.8,2]].forEach(([p, r]) => { const w = Math.max(bar, round(work * p, step)); if (w > rows[rows.length-1].w && w < work) rows.push({w, r}); });
  return rows;
}

/* ---------- level system (XP is derived from the session history, nothing extra is stored) ---------- */
const PATHS = {
  braise:{n:'Braise', c:'#ff3b2f', c2:'#ffc2b0', forms:['Étincelle','Flamme','Brasier','Fournaise','Soleil noir','Astre rouge']},
  foudre:{n:'Foudre', c:'#f2c94c', c2:'#fff6cf', forms:['Statique','Éclair','Orage','Tempête','Tonnerre','Ciel déchiré']},
  ombre:{n:'Ombre', c:'#9b5cff', c2:'#dccbff', forms:['Voile','Pénombre','Éclipse','Abîme','Nuit sans fin','Néant']},
  acier:{n:'Acier', c:'#8fa3b8', c2:'#eef4fa', forms:['Fer brut','Fer forgé','Acier','Acier trempé','Titane','Adamant']},
  ocean:{n:'Océan', c:'#2f8bff', c2:'#c4e2ff', forms:['Ruisseau','Courant','Vague','Marée','Tsunami','Abysses']},
};
const FORM_LVL = [1, 4, 8, 14, 22, 32];
const needXp = l => 150 + 60 * l;
const weekIdx = t => { const d = new Date(t); return Math.floor((Math.floor((d.getTime() - d.getTimezoneOffset() * 6e4) / 864e5) + 3) / 7); };
const heroOf = () => Object.assign({path:'braise', name:'', imgs:{}}, S.settings.hero || {});
/* muscle groups guessed from exercise names (French and English keywords) */
const MUSCLES = [
  ['Pecs', /couch|pec|dips|écart|ecart|pompe|bench|butterfly|chest/],
  ['Dos', /tract|rowing|tirage|pull.?over|\brow\b|(^|\s)lats?(\s|$)|dorsa|soulev[ée] de terre(?! roumain)|deadlift(?! roumain)|shrug|haussement/],
  ['Épaules', /militaire|épaul|epaul|élévation|elevation|face pull|overhead|arnold|oiseau|\bpress\b/],
  ['Biceps', /(?<!leg )curl(?! jambe| ischio)|biceps|marteau/],
  ['Triceps', /triceps|barre au front|skull|kickback|dips|(?<!leg )extension(?! (de )?jambe| quadri| mollet)/],
  ['Quadriceps', /squat|presse|fente|leg ext|extension (de )?jambe|hack|quadri|sissy/],
  ['Ischios', /roumain|leg curl|ischio|good morning|soulev[ée] de terre|deadlift|nordic/],
  ['Fessiers', /hip thrust|fess|glute|squat|fente|soulev[ée] de terre|deadlift/],
  ['Mollets', /mollet|calf/],
  ['Abdos', /abdo|gainage|crunch|planche|relev[ée] de jambe|core|roue|ab wheel/],
];
const groupsOf = n => { const s = String(n || '').toLowerCase(); return MUSCLES.filter(([, r]) => r.test(s)).map(([g]) => g); };
const RANKS = [[45,'SS'],[32,'S'],[22,'A'],[15,'B'],[10,'C'],[5,'D'],[1,'E']];
const rankOf = l => RANKS.find(([m]) => l >= m)[1];
const BOSSES = ['Golem de fonte','Hydre d’acier','Titan de pierre','Colosse rouillé','Wyrm des abysses','Minotaure de plomb','Kraken de fer','Chimère de bronze','Léviathan de béton','Béhémoth d’obsidienne','Gardien de granit','Roi de la forge'];
const monthIdx = t => { const d = new Date(t); return d.getFullYear() * 12 + d.getMonth(); };
function game(){
  const best = {}; let xp = 0, prs = 0, sets = 0, reps = 0, ton = 0, early = 0, long = 0;
  const ss = [...S.sessions].sort((a,b) => a.date - b.date);
  const W = {}, M = {}, lastTrained = {}, groupsWeek = {};
  const now = Date.now();
  for (const s of ss){ let n = 0, p = 0;
    const w = weekIdx(s.date), mo = monthIdx(s.date);
    W[w] = W[w] || {n:0, vol:0, prs:0, groups:new Set()};
    for (const e of s.exercises){ const k = e.name.trim().toLowerCase(); let m = 0;
      const gs = groupsOf(e.name);
      gs.forEach(g => { W[w].groups.add(g); lastTrained[g] = Math.max(lastTrained[g] || 0, s.date); if (now - s.date < 7 * 864e5) groupsWeek[g] = (groupsWeek[g] || 0) + e.sets.length; });
      for (const st of e.sets){ n++; reps += num(st.r); m = Math.max(m, e1rm(num(st.w), num(st.r))); }
      if (best[k] !== undefined && m > best[k]) p++;
      best[k] = Math.max(best[k] || 0, m); }
    const v = volOf(s); ton += v / 1000; sets += n; prs += p;
    W[w].n++; W[w].vol += v; W[w].prs += p; M[mo] = (M[mo] || 0) + v;
    xp += 40 + 6 * n + Math.round(v / 200) + 80 * p;
    if (new Date(s.date).getHours() < 7) early++;
    if ((s.duration || 0) >= 5400) long++; }
  // weekly quests
  const goal = Math.max(1, Math.min(7, num(S.settings.goal) || 3));
  const questsFor = w => {
    const d = W[w] || {n:0, vol:0, prs:0, groups:new Set()};
    const prev = [1,2,3,4].map(i => W[w - i]).filter(Boolean);
    const target = prev.length ? Math.round(prev.reduce((a, b) => a + b.vol, 0) / prev.length * 1.1 / 100) * 100 : 5000;
    return [
      {t:'Assidu', d:`${goal} séances dans la semaine`, x:150, have:d.n, need:goal},
      {t:'Briseur de plafond', d:'Battre au moins 1 record', x:100, have:d.prs, need:1},
      {t:'Surcharge', d:`Soulever ${fmtKg(target)} kg dans la semaine`, x:120, have:Math.round(d.vol), need:target},
      {t:'Corps complet', d:'Travailler 5 groupes musculaires', x:80, have:d.groups.size, need:5},
    ].map(q => ({...q, ok: q.have >= q.need}));
  };
  let questsDone = 0;
  Object.keys(W).forEach(w => questsFor(+w).forEach(q => { if (q.ok) { xp += q.x; questsDone++; } }));
  // monthly boss
  const hpFor = mo => Math.max(15000, Math.round((M[mo - 1] || 0) * 1.1 / 500) * 500);
  let bossesWon = 0;
  Object.keys(M).forEach(mo => { if (M[mo] >= hpFor(+mo)) { xp += 400; bossesWon++; } });
  const curMo = monthIdx(now), dNow = new Date(now);
  const boss = {name: BOSSES[curMo % 12], hp: hpFor(curMo), dmg: Math.round(M[curMo] || 0),
    daysLeft: new Date(dNow.getFullYear(), dNow.getMonth() + 1, 0).getDate() - dNow.getDate()};
  boss.dead = boss.dmg >= boss.hp;
  const weeks = [...new Set(ss.map(s => weekIdx(s.date)))].sort((a,b) => a - b);
  let maxStreak = 0, run = 0, prev = null;
  for (const w of weeks){ run = prev !== null && w === prev + 1 ? run + 1 : 1; maxStreak = Math.max(maxStreak, run); prev = w; }
  let cur = 0; { const set = new Set(weeks); let w = weekIdx(Date.now()); if (!set.has(w)) w--; while (set.has(w)){ cur++; w--; } }
  const n = ss.length;
  const badges = [
    ['Premier pas','1 séance terminée',50, n >= 1], ['Habitué','10 séances',150, n >= 10], ['Vétéran','25 séances',300, n >= 25],
    ['Pilier de la salle','50 séances',600, n >= 50], ['Centurion','100 séances',1200, n >= 100],
    ['10 tonnes','10 t soulevées au total',100, ton >= 10], ['50 tonnes','50 t soulevées',250, ton >= 50], ['100 tonnes','100 t soulevées',500, ton >= 100],
    ['250 tonnes','250 t soulevées',900, ton >= 250], ['500 tonnes','500 t soulevées',1500, ton >= 500],
    ['Premier record','1 record battu',100, prs >= 1], ['Chasseur de records','10 records battus',300, prs >= 10], ['Briseur de limites','25 records battus',700, prs >= 25],
    ['Un mois sans faille','4 semaines d’affilée',250, maxStreak >= 4], ['Discipline de fer','8 semaines d’affilée',500, maxStreak >= 8], ['Inarrêtable','12 semaines d’affilée',900, maxStreak >= 12],
    ['Lève-tôt','1 séance commencée avant 7 h',100, early >= 1], ['Marathon','1 séance de 90 min ou plus',100, long >= 1],
    ['1 000 séries','1 000 séries validées',500, sets >= 1000], ['10 000 reps','10 000 répétitions',500, reps >= 10000],
    ['Tueur de boss','Vaincre 1 boss du mois',200, bossesWon >= 1], ['Exterminateur','Vaincre 6 boss',800, bossesWon >= 6],
    ['Chasseur de quêtes','10 quêtes accomplies',200, questsDone >= 10], ['Mercenaire','50 quêtes accomplies',700, questsDone >= 50],
  ].map(([t, d, x, ok]) => ({t, d, x, ok}));
  badges.forEach(b => { if (b.ok) xp += b.x; });
  let lvl = 1, rem = xp; while (rem >= needXp(lvl)){ rem -= needXp(lvl); lvl++; }
  let form = 0; FORM_LVL.forEach((l, i) => { if (lvl >= l) form = i; });
  const force = Object.values(best).sort((a,b) => b - a).slice(0, 3).reduce((a,b) => a + b, 0);
  const wk = weekIdx(Date.now());
  return {xp, lvl, rem, need: needXp(lvl), form, badges, prs, sets, reps, ton, cur, maxStreak, force, weekCount: ss.filter(s => weekIdx(s.date) === wk).length,
    rank: rankOf(lvl), quests: questsFor(wk), questsDone, boss, bossesWon, lastTrained, groupsWeek};
}
let avN = 0;
/* Original fighter: full-body rim-lit silhouette built from a small joint rig.
   One pose per path; build, gear and energy all grow with the form. */
function avatarSVG(pk, form){
  if (!PATHS[pk]) pk = 'braise';

async function setHeroImg(file, f){

function makeEx(name, sets, reps, rest){
  const last = lastFor(name);
  const tr = topReps(reps) || '';
  const n = Math.max(1, sets || (last ? last.ex.sets.length : 3));
  const arr = [];
  for (let i = 0; i < n; i++){
    const ls = last?.ex.sets[i] || last?.ex.sets[last.ex.sets.length - 1];
    arr.push({w: ls ? String(ls.w) : '', r: tr ? String(tr) : (ls ? String(ls.r) : ''), done:false});
  }
  return {id: gid('x'), name, target: sets ? `${sets} × ${reps}` : '', reps, rest: rest || 90, sets: arr, note:''};
}

let armed = null;
function confirmTap(btn){
  if (armed === btn) { armed = null; return true; }

}

function chartSVG(pts, unit){
  const W = 600, H = 230, L = 46, R = 16, T = 22, B = 30;
  if (pts.length < 2) return `<div class="small muted" style="padding:18px 0;text-align:center">${pts.length ? 'Une seule mesure : la courbe apparaît dès la deuxième.' : 'Pas encore de données.'}</div>`;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * .15 || y1 * .1 || 1; y0 = Math.max(0, y0 - pad); y1 += pad;
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const X = x => L + (x - x0) / (x1 - x0 || 1) * (W - L - R), Y = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  const F = 'font-family="Inter,system-ui"';
  let g = '';
  for (let i = 0; i <= 3; i++){ const v = y0 + (y1 - y0) * i / 3, yy = Y(v);
    g += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#2e2e2e" stroke-width="1"/><text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="12" fill="#a6a6a6" ${F}>${Math.round(v)}</text>`; }
  g += `<text x="${L}" y="${H-8}" font-size="12" fill="#a6a6a6" ${F}>${new Date(x0).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</text>
        <text x="${W-R}" y="${H-8}" text-anchor="end" font-size="12" fill="#a6a6a6" ${F}>${new Date(x1).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</text>`;
  const line = pts.map((p,i) => `${i?'L':'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area = `${line}L${X(x1).toFixed(1)},${H-B}L${X(x0).toFixed(1)},${H-B}Z`;
  const lp = pts[pts.length-1];
  const dots = pts.map(p => `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="#e10600"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution">
    <defs><linearGradient id="gr" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e10600" stop-opacity=".45"/><stop offset="1" stop-color="#e10600" stop-opacity="0"/></linearGradient></defs>
    ${g}<path d="${area}" fill="url(#gr)"/><path d="${line}" fill="none" stroke="#e10600" stroke-width="3" stroke-linejoin="round"/>${dots}
    <circle cx="${X(lp.x)}" cy="${Y(lp.y)}" r="6" fill="#060606" stroke="#ff3b2f" stroke-width="3"/>
    <text x="${Math.min(X(lp.x), W-R-4)}" y="${Math.max(Y(lp.y)-12, 16)}" text-anchor="end" font-size="20" fill="#f4f4f4" font-family="Anton,Impact,sans-serif">${fmtKg(lp.y)} ${unit}</text></svg>`;
}

function calendarHTML(){
  const byDay = {};
  S.sessions.forEach(s => { const k = startOfDay(s.date); byDay[k] = (byDay[k] || 0) + volOf(s) + 1; });
  const vals = Object.values(byDay).sort((a,b) => a - b); const q = p => vals[Math.floor((vals.length - 1) * p)] || 0;
  const today = startOfDay(Date.now());
  const dow = (new Date(today).getDay() + 6) % 7; // Monday = 0
  const startMon = today - dow * 864e5 - 12 * 7 * 864e5;
  let cells = '';
  for (let r = 0; r < 7; r++) for (let w = 0; w < 13; w++){
    const t = startMon + (w * 7 + r) * 864e5;
    if (t > today) { cells += '<i class="void"></i>'; continue; }
    const v = byDay[startOfDay(t)] || 0;
    const lvl = !v ? '' : v <= q(.25) ? 'l1' : v <= q(.5) ? 'l2' : v <= q(.8) ? 'l3' : 'l4';
    cells += `<i class="${lvl}${t === today ? ' today' : ''}" title="${new Date(t).toLocaleDateString('fr-FR')}"></i>`;
  }
  // streak in weeks
  const streak = game().cur;
  const month = S.sessions.filter(s => { const d = new Date(s.date), n = new Date(); return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear(); }).length;
  return `<div class="card"><div class="row between"><h3>Régularité</h3><span class="small muted">13 semaines · lun → dim</span></div>
    <div class="cal">${cells}</div>
    <div class="stats"><div class="stat"><div class="k">Série en cours</div><div class="v">${streak}<span class="small muted"> sem.</span></div></div>
    <div class="stat"><div class="k">Ce mois-ci</div><div class="v">${month}</div></div>
    <div class="stat"><div class="k">Total</div><div class="v">${S.sessions.length}</div></div></div></div>`;
}

function softRender(){
  const a = document.activeElement;
  if (a && main.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { pendingRender = true; return; }
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

/* ---------- rest timer ---------- */
let T = null, actx = null;
function unlockAudio(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch {} }
function beep(){
  try { navigator.vibrate?.([200,100,200,100,300]); } catch {}
  if (!actx || !S.settings.sound) return;
  [0, .25, .5].forEach((t, i) => { const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = i === 2 ? 1180 : 880; o.connect(g); g.connect(actx.destination);
    const s = actx.currentTime + t; g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(.35, s + .02); g.gain.exponentialRampToValueAtTime(.0001, s + .18);
    o.start(s); o.stop(s + .2); });
}
function startTimer(sec, label){ T = {end: Date.now() + sec*1000, total: sec, label, rung:false}; document.getElementById('timer').hidden = false; tick(); }
function stopTimer(){ T = null; document.getElementById('timer').hidden = true; document.getElementById('timer').classList.remove('ending'); }
function tick(){
  const el = document.getElementById('elapsed'); if (el && S.current) el.textContent = fmtDur((Date.now() - S.current.start)/1000);
  if (!T) return;
  const left = (T.end - Date.now())/1000;
  const box = document.getElementById('timer');
  document.getElementById('tTime').textContent = left > 0 ? fmtDur(Math.ceil(left)) : '+' + fmtDur(-left);
  document.getElementById('tLbl').textContent = left > 0 ? T.label : 'Repos terminé · à toi';
  document.getElementById('tBar').style.width = Math.max(0, Math.min(100, (1 - left / T.total) * 100)) + '%';
  box.classList.toggle('ending', left <= 0);
  if (left <= 0 && !T.rung){ T.rung = true; beep(); }
  if (left < -60) stopTimer();
}
setInterval(tick, 250);

let wl = null;
async function wakeLock(){
  try {
    if (S.current && !wl && document.visibilityState === 'visible' && navigator.wakeLock) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => wl = null); }
    if (!S.current && wl) { wl.release(); wl = null; }
  } catch { wl = null; }
}
document.addEventListener('visibilitychange', wakeLock);

async function doExport(){
  const {current, ...rest} = S;
  const data = JSON.stringify({app:'chikara', version:1, exportedAt:new Date().toISOString(), ...rest, settings:{...S.settings, bg:{...S.settings.bg, id:null, local:false, mode:'kanji'}}}, null, 2);
  const name = `chikara-${new Date().toISOString().slice(0,10)}.json`;
  if (downloadsApi){
    try { await downloadsApi.save({filename:name, data}); return; } catch (e) { if (e?.code !== 'unavailable') { toast('Export annulé'); return; } }
  }
  if (!window.claude){
    // standalone web app: share sheet on iPhone (Enregistrer dans Fichiers), plain download elsewhere
    try {
      const file = new File([data], name, {type: 'application/json'});
      if (navigator.canShare?.({files: [file]})) { await navigator.share({files: [file], title: 'Sauvegarde Chikara'}); return; }
    } catch (e) { if (e?.name === 'AbortError') return; }
    try {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type: 'application/json'})); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); return;
    } catch {}
  }
  document.getElementById('exportBox').innerHTML = `<div class="small muted">Le téléchargement n'est pas possible ici : copie ce texte et garde-le dans un fichier.</div><textarea id="exporttxt" readonly style="min-height:140px;font-size:12px">${esc(data)}</textarea><button data-act="copyexport">Copier</button>`;
}
async function doImport(file){
  try {
    const j = JSON.parse(await file.text());
    if (!j || !Array.isArray(j.sessions) || !j.program) throw new Error('format');
    const ids = new Set(S.sessions.map(s => s.id));
    j.sessions.forEach(s => { if (s && s.id && Array.isArray(s.exercises) && !ids.has(s.id)) S.sessions.push(s); });
    const nids = new Set(S.notes.map(n => n.id));
    (j.notes || []).forEach(n => { if (n && n.id && !nids.has(n.id)) S.notes.push(n); });
    S.program = {days: Array.isArray(j.program.days) ? j.program.days : []};
    if (j.body?.entries) S.body = {entries: j.body.entries};
    if (j.measures?.entries) S.measures = {entries: j.measures.entries};
    if (j.settings) S.settings = Object.assign(DEF_SETTINGS(), j.settings, {bg: S.settings.bg});
    pushAll(); saveCache(); render(); toast(`Import terminé : ${j.sessions.length} séances lues`);
  } catch (e) { console.warn(e); toast('Fichier non reconnu : choisis un export de Chikara'); }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  unlockAudio();
  const nb = e.target.closest('nav button[data-tab]');
  if (nb){ tab = nb.dataset.tab; try { localStorage.setItem(LS + '-tab', tab); } catch {} render(); window.scrollTo(0,0); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, d = +b.dataset.d, x = +b.dataset.x, ei = +b.dataset.e, si = +b.dataset.s, v = b.dataset.v;
  const c = S.current;
  switch (a){
    case 'goto': tab = v; render(); break;
    case 'template':
      S.program.days.push(...TPL.map(([n, ex]) => ({id: gid('d'), name: n, exercises: ex.map(([en,s,r,p]) => ({id: gid('e'), name: en, sets: s, reps: r, rest: p}))})));
      saveProgram(); render(); toast('Programme exemple ajouté, modifie-le dans Prog.'); break;
    case 'start': {
      const day = S.program.days[d];
      S.current = {id: gid('s'), dayId: day.id, dayName: day.name, start: Date.now(), note: '', exercises: day.exercises.filter(x => x.name.trim()).map(x => makeEx(x.name.trim(), num(x.sets), x.reps, num(x.rest)))};
      saveCurrent(0); render(); window.scrollTo(0,0); break; }
    case 'startfree': S.current = {id: gid('s'), dayId: null, dayName: '', start: Date.now(), note: '', exercises: []}; saveCurrent(0); render(); break;
    case 'done': {
      const s = c.exercises[ei].sets[si]; s.done = !s.done; saveCurrent();
      if (s.done) startTimer(c.exercises[ei].rest || 90, `Repos · ${c.exercises[ei].name}`);
      softRender(); break; }
    case 'addset': { const ex = c.exercises[ei]; const l = ex.sets[ex.sets.length-1]; ex.sets.push({w: l?.w || '', r: l?.r || '', done: false}); saveCurrent(); render(); break; }
    case 'rmset': c.exercises[ei].sets.pop(); saveCurrent(); render(); break;
    case 'mvex': { const [it] = c.exercises.splice(ei, 1); c.exercises.splice(ei + +v, 0, it); saveCurrent(); render(); break; }
    case 'warm': { const id = c.exercises[ei].id; openWarm.has(id) ? openWarm.delete(id) : openWarm.add(id); softRender(); break; }
    case 'rest': startTimer(c.exercises[ei].rest || 90, `Repos · ${c.exercises[ei].name}`); break;
    case 'addex': { const i = document.getElementById('addex'); const n = i.value.trim(); if (!n) { i.focus(); break; } c.exercises.push(makeEx(n, 0, '', 90)); saveCurrent(); render(); break; }
    case 'abort': if (!confirmTap(b)) break; S.current = null; saveCurrent(0); stopTimer(); render(); toast('Séance abandonnée'); break;
    case 'finish': {
      const exs = c.exercises.map(ex => ({name: ex.name, note: ex.note, sets: ex.sets.filter(s => s.done).map(s => ({w: num(s.w), r: num(s.r)}))})).filter(ex => ex.sets.length);
      if (!exs.length){ toast('Valide au moins une série (✓) avant de terminer'); break; }
      if (!confirmTap(b)) break;
      const sess = {id: c.id, dayId: c.dayId, dayName: c.dayName, date: c.start, duration: Math.round((Date.now() - c.start)/1000), note: c.note, exercises: exs};
      const prs = exs.filter(ex => { const prev = S.sessions.flatMap(s => s.exercises.filter(e => same(e.name, ex.name))).flatMap(e => e.sets);
        return prev.length && Math.max(...ex.sets.map(s => e1rm(s.w, s.r))) > Math.max(...prev.map(s => e1rm(num(s.w), num(s.r)))); }).map(e => e.name);
      const g0 = game();
      S.sessions.push(sess); put(sess.id, {type: 'session', ...sess});
      const g1 = game();
      S.current = null; saveCurrent(0); stopTimer(); render(); window.scrollTo(0,0);
      showSummary(sess, prs, g0, g1);
      break; }
    case 'closelvl': document.getElementById('lvlup').hidden = true; break;
    case 'closesum': document.getElementById('summary').hidden = true; render(); break;
    case 'energy': { const s = S.sessions.find(x => x.id === b.dataset.s); if (!s) break; s.energy = +v; put(s.id, {type: 'session', ...s});
      b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); break; }
    case 'path': S.settings.hero = {...heroOf(), path: v}; saveSettings(0); render(); break;
    case 'rmheroimg': { const hr = heroOf(), f = +v, old = hr.imgs[f]; const imgs = {...hr.imgs}; delete imgs[f]; S.settings.hero = {...hr, imgs};
      if (old === 'local') { try { localStorage.removeItem(LS + '-hero-' + f); } catch {} }
      else if (old && assetsApi) assetsApi.delete(old).catch(() => {});
      saveSettings(0); render(); break; }
    case 'tquick': startTimer(+v, 'Minuteur'); break;
    case 'tadd': if (T){ T.end += +v*1000; T.total = Math.max(1, T.total + +v); if (T.end > Date.now()) T.rung = false; tick(); } break;
    case 'tstop': stopTimer(); break;
    case 'addday': S.program.days.push({id: gid('d'), name: '', exercises: []}); saveProgram(); render(); break;
    case 'dupday': { const src = S.program.days[d]; S.program.days.splice(d + 1, 0, {id: gid('d'), name: src.name + ' (copie)', exercises: src.exercises.map(e => ({...e, id: gid('e')}))}); saveProgram(); render(); break; }
    case 'rmday': if (!confirmTap(b)) break; S.program.days.splice(d, 1); saveProgram(); render(); break;
    case 'mvday': { const arr = S.program.days; const [it] = arr.splice(d, 1); arr.splice(d + +v, 0, it); saveProgram(); render(); break; }
    case 'addpex': S.program.days[d].exercises.push({id: gid('e'), name: '', sets: 3, reps: '10', rest: 90}); saveProgram(); render(); break;
    case 'rmex': S.program.days[d].exercises.splice(x, 1); saveProgram(); render(); break;
    case 'metric': prog.metric = v; render(); break;
    case 'addbw': { const i = document.getElementById('bw'); const kg = num(i.value); if (!kg){ i.focus(); break; } S.body.entries.push({d: Date.now(), kg}); saveBody(); render(); break; }
    case 'rmbw': { if (!confirmTap(b)) break; const be = [...S.body.entries].sort((a,b) => a.d - b.d); be.pop(); S.body.entries = be; saveBody(); render(); break; }
    case 'addm': { const en = {d: Date.now()}; let any = false; ['bras','poitrine','taille','cuisse'].forEach(k => { const vv = num(document.getElementById('m-' + k).value); if (vv) { en[k] = vv; any = true; } });
      if (!any) { toast('Entre au moins une mesure'); break; } S.measures.entries.push(en); saveMeasures(); render(); toast('Mesures enregistrées'); break; }
    case 'rmsess': if (!confirmTap(b)) break; S.sessions = S.sessions.filter(s => s.id !== v); del(v); render(); break;
    case 'addnote': { const t = document.getElementById('newnote').value.trim(); if (!t) break; const n = {id: gid('n'), date: Date.now(), text: t, pin: false}; S.notes.push(n); put(n.id, {type: 'note', ...n}); render(); break; }
    case 'pin': { const n = S.notes.find(n => n.id === v); n.pin = !n.pin; put(n.id, {type: 'note', ...n}); render(); break; }
    case 'rmnote': if (!confirmTap(b)) break; S.notes = S.notes.filter(n => n.id !== v); del(v); render(); break;
    case 'bgmode': S.settings.bg = {...S.settings.bg, mode: v}; saveSettings(0); paintBg(); render(); break;
    case 'bgfx': S.settings.bg = {...S.settings.bg, fx: v}; saveSettings(0); paintBg(); render(); break;
    case 'sound': S.settings.sound = !S.settings.sound; saveSettings(0); render(); break;
    case 'export': doExport(); break;
    case 'copyexport': { const t = document.getElementById('exporttxt'); navigator.clipboard?.writeText(t.value).then(() => toast('Copié'), () => { t.select(); toast('Sélectionné : copie-le manuellement'); }); break; }
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'bgfile' && t.files?.[0]) setBgImage(t.files[0]);
  if (t.id === 'importfile' && t.files?.[0]) doImport(t.files[0]);
  if (t.dataset.heroform !== undefined && t.files?.[0]) setHeroImg(t.files[0], +t.dataset.heroform);
});

document.addEventListener('input', e => {
  const t = e.target, f = t.dataset.bind; if (!f) return;
  const c = S.current, d = +t.dataset.d, x = +t.dataset.x;
  const out = (id, html) => { const o = document.getElementById(id); if (o) o.innerHTML = html; };
  if (f === 'w' || f === 'r'){ c.exercises[+t.dataset.e].sets[+t.dataset.s][f] = t.value; saveCurrent(); }
  else if (f === 'exnote'){ c.exercises[+t.dataset.e].note = t.value; saveCurrent(); }
  else if (f === 'snote'){ c.note = t.value; saveCurrent(); }
  else if (f === 'dname'){ S.program.days[d].name = t.value; saveProgram(); }
  else if (f === 'ename'){ S.program.days[d].exercises[x].name = t.value; saveProgram(); }
  else if (f === 'esets'){ S.program.days[d].exercises[x].sets = num(t.value); saveProgram(); }
  else if (f === 'ereps'){ S.program.days[d].exercises[x].reps = t.value; saveProgram(); }
  else if (f === 'erest'){ S.program.days[d].exercises[x].rest = num(t.value); saveProgram(); }
  else if (f === 'pex'){ prog.ex = t.value; render(); }
  else if (f === 'tplate'){ tools.plate = num(t.value); out('plateOut', platesHTML(tools.plate)); }
  else if (f === 'rmw' || f === 'rmr'){ tools[f === 'rmw' ? 'rmW' : 'rmR'] = num(t.value); out('rmOut', rmOut(e1rm(tools.rmW, tools.rmR))); }
  else if (f === 'twarm'){ tools.warm = num(t.value); out('warmOut', warmOut()); }
  else if (f === 'heroname'){ S.settings.hero = {...heroOf(), name: t.value.slice(0, 24)}; saveSettings(); }
  else if (f === 'sgoal'){ const n = Math.round(num(t.value)); if (n >= 1 && n <= 7){ S.settings.goal = n; saveSettings(); } }
  else if (f === 'bgop'){ S.settings.bg = {...S.settings.bg, op: num(t.value)}; const p = document.querySelector('#bg .photo'); if (p) p.style.opacity = S.settings.bg.op; saveSettings(); }
  else if (f === 'sbar'){ S.settings.bar = num(t.value); saveSettings(); out('plateOut', platesHTML(tools.plate)); out('warmOut', warmOut()); }
  else if (f === 'splates'){ const p = t.value.split(/[\s;,]+/).map(num).filter(n => n > 0); if (p.length){ S.settings.plates = p; saveSettings(); out('plateOut', platesHTML(tools.plate)); out('warmOut', warmOut()); } }
  saveCache();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'addex') { e.preventDefault(); document.querySelector('[data-act="addex"]').click(); }
  if (e.key === 'Enter' && e.target.id === 'bw') { e.preventDefault(); document.querySelector('[data-act="addbw"]').click(); }
});

paintBg();
render();
connect();
})();
</script>


<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
try { navigator.storage?.persist?.(); } catch {}
</script>
